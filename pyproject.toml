[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "brunata_online"
version = "0.0.2"
authors = [
  { name="Lasse Luttermann", email="git@2x2.dk" },
]
description = "API interface for online.brunata.com to fetch meter values"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests >= 2.34"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://codeberg.org/luttermann/brunata_online"
Issues = "https://codeberg.org/luttermann/brunata_online/issues"

